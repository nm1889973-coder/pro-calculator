
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pro Calculator</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 20px 12px;
    font-family: Arial, sans-serif;
    background: #eaf0f8;
    color: #202938;
  }

  .app {
    width: 100%;
    max-width: 360px;
    margin: auto;
  }

  h1 {
    text-align: center;
    font-size: 25px;
    margin: 5px 0 18px;
  }

  .calculator {
    background: #202938;
    padding: 16px;
    border-radius: 22px;
    box-shadow: 0 8px 22px #0002;
  }

  #display {
    width: 100%;
    height: 70px;
    padding: 12px;
    border: 0;
    border-radius: 12px;
    margin-bottom: 12px;
    text-align: right;
    font-size: 28px;
    color: #182235;
    background: #fff;
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
  }

  button {
    min-width: 0;
    min-height: 52px;
    border: 0;
    border-radius: 10px;
    font-size: 19px;
    font-weight: 600;
    background: #eef2f7;
    color: #202938;
    cursor: pointer;
    touch-action: manipulation;
  }

  button:active { opacity: 0.75; }
  .operator { background: #ffc46b; }
  .special { background: #b9d7ff; }

  .history-panel {
    margin-top: 16px;
    background: white;
    padding: 14px;
    border-radius: 16px;
    box-shadow: 0 5px 15px #0001;
  }

  .history-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  h2 {
    font-size: 18px;
    margin: 0;
  }

  #clearHistory {
    min-height: 36px;
    padding: 6px 10px;
    font-size: 12px;
    background: #ffe0e0;
    color: #9b2020;
  }

  #historyList {
    padding: 0;
    margin: 12px 0 0;
    list-style: none;
    max-height: 220px;
    overflow-y: auto;
  }

  #historyList li {
    padding: 11px 4px;
    border-bottom: 1px solid #e5e9f0;
    overflow-wrap: anywhere;
    font-size: 15px;
  }

  #historyList li:last-child { border-bottom: 0; }

  .empty {
    color: #778195;
    text-align: center;
    padding: 14px 0;
    font-size: 14px;
  }

  .note {
    text-align: center;
    font-size: 12px;
    color: #667085;
    margin-top: 12px;
  }
</style>
</head>

<body>
<div class="app">
  <h1>✨ Pro Calculator</h1>

  <section class="calculator">
    <input id="display" value="0" readonly
           aria-label="Calculator display">

    <div class="buttons">
      <button class="special" onclick="clearDisplay()">C</button>
      <button class="special" onclick="percent()">%</button>
      <button class="special" onclick="toggleSign()">±</button>
      <button class="operator" onclick="press('/')">÷</button>

      <button onclick="press('7')">7</button>
      <button onclick="press('8')">8</button>
      <button onclick="press('9')">9</button>
      <button class="operator" onclick="press('*')">×</button>

      <button onclick="press('4')">4</button>
      <button onclick="press('5')">5</button>
      <button onclick="press('6')">6</button>
      <button class="operator" onclick="press('-')">−</button>

      <button onclick="press('1')">1</button>
      <button onclick="press('2')">2</button>
      <button onclick="press('3')">3</button>
      <button class="operator" onclick="press('+')">+</button>

      <button onclick="press('0')">0</button>
      <button onclick="press('.')">.</button>
      <button onclick="backspace()">⌫</button>
      <button class="operator" onclick="calculate()">=</button>
    </div>
  </section>

  <section class="history-panel">
    <div class="history-heading">
      <h2>🧾 History</h2>
      <button id="clearHistory" onclick="clearHistory()">
        Clear History
      </button>
    </div>

    <ul id="historyList"></ul>
  </section>

  <p class="note">Your calculations, all in one place.</p>
</div>

<script>
const display = document.getElementById("display");
const historyList = document.getElementById("historyList");

let expression = "";
let finished = false;
let history = [];

try {
  const saved = localStorage.getItem("proCalculatorHistory");
  if (saved) {
    const parsed = JSON.parse(saved);
    if (Array.isArray(parsed)) {
      history = parsed.filter(
        item => item &&
          typeof item.expression === "string" &&
          typeof item.answer === "string"
      ).slice(0, 50);
    }
  }
} catch {
  history = [];
}

function renderHistory() {
  historyList.replaceChildren();

  if (history.length === 0) {
    const item = document.createElement("li");
    item.className = "empty";
    item.textContent = "No calculations yet.";
    historyList.appendChild(item);
    return;
  }

  history.forEach(entry => {
    const item = document.createElement("li");
    item.textContent = entry.expression + " = " + entry.answer;
    historyList.appendChild(item);
  });
}

function saveHistory() {
  try {
    localStorage.setItem(
      "proCalculatorHistory",
      JSON.stringify(history)
    );
  } catch {
    // The calculator still works if storage is unavailable.
  }
}

function addHistory(original, answer) {
  history.unshift({ expression: original, answer: answer });
  history = history.slice(0, 50);
  saveHistory();
  renderHistory();
}

function press(value) {
  if (finished) {
    expression = "";
    finished = false;
  }

  expression += value;
  display.value = expression;
}

function clearDisplay() {
  expression = "";
  display.value = "0";
  finished = false;
}

function backspace() {
  if (finished) {
    clearDisplay();
    return;
  }

  expression = expression.slice(0, -1);
  display.value = expression || "0";
}

function evaluateExpression(text) {
  if (!/^[0-9+*/.() -]+$/.test(text)) {
    throw new Error("Invalid expression");
  }

  const result = Function(
    '"use strict"; return (' + text + ')'
  )();

  if (typeof result !== "number" || !Number.isFinite(result)) {
    throw new Error("Invalid result");
  }

  return Number(result.toPrecision(12));
}

function calculate() {
  if (!expression) return;

  const original = expression;

  try {
    const result = evaluateExpression(original);
    const answer = String(result);

    addHistory(original, answer);

    expression = answer;
    display.value = answer;
    finished = true;
  } catch {
    display.value = "Error";
    expression = "";
    finished = false;
  }
}

function percent() {
  if (!expression) return;

  try {
    const original = expression;
    const result = evaluateExpression(original) / 100;
    if (!Number.isFinite(result)) throw new Error();

    expression = String(Number(result.toPrecision(12)));
    display.value = expression;
    finished = true;
  } catch {
    display.value = "Error";
    expression = "";
    finished = false;
  }
}

function toggleSign() {
  if (!expression) return;

  try {
    const result = evaluateExpression(expression);
    expression = String(-result);
    display.value = expression;
    finished = true;
  } catch {
    display.value = "Error";
    expression = "";
    finished = false;
  }
}

function clearHistory() {
  history = [];
  saveHistory();
  renderHistory();
}

document.addEventListener("keydown", function(event) {
  if (/^[0-9.+*/()-]$/.test(event.key)) {
    press(event.key);
  } else if (event.key === "Enter" || event.key === "=") {
    calculate();
  } else if (event.key === "Backspace") {
    backspace();
  } else if (event.key === "Escape") {
    clearDisplay();
  }
});

renderHistory();
</script>
</body>
</html>
